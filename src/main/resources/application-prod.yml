spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://prod-db:3306/enterprise_rag?useUnicode=true&characterEncoding=utf8mb4&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:rag_user}
    password: ${DB_PASSWORD:rag_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${OPENAI_API_KEY:sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      embedding:
        model: ${EMBEDDING_MODEL:bge-large-zh-v1.5}
      chat:
        model: ${CHAT_MODEL:deepseek-chat}
        temperature: 0.3
        max-tokens: 1000
  tika:
    enabled: true

enterprise:
  rag:
    milvus:
      host: ${MILVUS_HOST:milvus-prod}
      port: ${MILVUS_PORT:19530}
      collection-name: rag_document_chunks
      dimension: 1024
      metric-type: COSINE
      index-type: IVF_FLAT
      nlist: 100
    document:
      chunk:
        max-size: 512
        overlap: 50
        strategy: fixed
      parse-timeout: 180
      vector-timeout: 600
    permission:
      default-view: DEPT
      dept-permission-enabled: true
    redis:
      host: ${REDIS_HOST:redis-prod}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
