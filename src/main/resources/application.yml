spring:
  application:
    name: enterprise-rag
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      enabled: true

--- # 开发环境
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/enterprise_rag?useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  ai:
    openai:
      base-url: https://api.deepseek.com/v1  # 或通义千问地址
      api-key: sk-0479be630986491db7a70c8f0b28519c
      embedding:
        model: bge-large-zh-v1.5  # 中文向量模型
      chat:
        model: deepseek-v4-flash
        temperature: 0.7
        max-tokens: 1000
  tika:
    enabled: true

# 自定义配置
enterprise:
  rag:
    # 向量数据库 Milvus 配置
    milvus:
      host: localhost
      port: 19530
      collection-name: rag_document_chunks
      dimension: 1024  # bge-large-zh-v1.5 输出维度
      metric-type: COSINE
      index-type: IVF_FLAT
      nlist: 100
    # 文档处理配置
    document:
      # 分片策略
      chunk:
        max-size: 300        # 最大字符数
        overlap: 30          # 重叠字符数
        strategy: fixed      # 分片策略：fixed=固定长度, semantic=语义分片
      # 超时配置（秒）
      parse-timeout: 120
      vector-timeout: 300
    # 权限配置
    permission:
      default-view: PUBLIC  # PUBLIC/DEPT/PRIVATE
      dept-permission-enabled: true
    # Redis 缓存配置
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
